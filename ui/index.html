<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>dsh-model-team · 阶段 1 预览（Mock 数据）</title>
  <!-- 样式按职责分四份，全部 ≤400 行；app.css 是同顺序的 @import 汇总入口 -->
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/views.css">
  <link rel="stylesheet" href="css/panels.css">
  <link rel="stylesheet" href="css/mention.css">
</head>
<body>
  <!-- design-only:begin -->
  <!-- 垫场背景：只给设计稿预览用，构建时会整段剥掉，不进宿主（见 build.cjs 的 readUiSkeleton） -->
  <div class="desk" aria-hidden="true">
    <div class="desk-bar">DeepSeekHarness · 会话工作区（背景占位）</div>
    <div class="desk-card">
      <div class="desk-line w60"></div>
      <div class="desk-line w90"></div>
      <div class="desk-line w75"></div>
      <div class="desk-line w45"></div>
    </div>
    <div class="desk-tip">阶段 1 预览 · 全部数据为 Mock · 不发任何网络请求</div>
  </div>
  <!-- design-only:end -->

  <!-- 悬浮窗收起态：模型 pill + 圆球，整体可拖动 -->
  <div class="float-dock" id="floatDock">
    <!-- pill 在球左侧，球拖到屏幕最右边时不会被挤出视口 -->
    <div class="float-pill" id="floatPill">
      <span class="pill-model">( — )</span>
      <span class="pill-dot"></span>
    </div>
    <button class="float-ball" id="floatBall" type="button" title="点击展开模型团队悬浮窗（可拖动）">
      <span class="fb-target" data-fb-target>—</span>
      <span class="fb-dot"></span>
    </button>
  </div>

  <!-- 悬浮窗展开态：当前群聊 / 当前目标 / 当前速率 / 全局请求量 -->
  <section class="float-panel hidden" id="floatPanel" aria-label="模型团队悬浮窗">
    <header class="fp-head" id="fpHead">
      <button class="fp-title-btn" id="fpTitle" type="button" title="进入我的数据库">👤 我的模型团队</button>
      <span class="fp-model" id="fpModel">模型 —</span>
      <span class="fp-ops">
        <button class="fp-btn" id="fpMin" type="button" title="收起为悬浮球">—</button>
        <button class="fp-btn" id="fpClose" type="button" title="关闭悬浮窗">×</button>
      </span>
    </header>
    <div class="fp-body">
      <div class="fp-row"><span class="fp-k">当前群聊：</span><span class="fp-v" id="fpGroup">—</span></div>
      <div class="fp-row"><span class="fp-k">会话：</span><span class="fp-v" id="fpSession">—</span></div>
      <div class="fp-row"><span class="fp-k">当前目标：</span><span class="fp-v" id="fpTarget">—</span></div>
      <div class="fp-row"><span class="fp-k">📊 当前速率：</span><span class="fp-v" id="fpRate">— tok/s</span></div>
      <div class="fp-row"><span class="fp-k">📈 全局请求量：</span><span class="fp-v" id="fpTotal">—</span></div>
    </div>
    <footer class="fp-foot">
      <button class="fp-enter" id="fpEnter" type="button">[ 进入群聊界面 &gt; ]</button>
      <button class="fp-enter fp-contacts" id="btnContacts" type="button">📇 通讯录 · 好友分组</button>
    </footer>
  </section>

  <!-- 关闭悬浮窗后的召回入口 -->
  <button class="float-recall hidden" id="floatRecall" type="button">💬 呼出模型团队</button>

  <!-- 模型团队主窗口：各视图渲染进 #viewRoot；底部固定三 tab（契约条款 21-24） -->
  <main class="team-app">
    <header class="team-bar">
      <span class="team-logo">团队</span>
      <span class="team-view-name" id="viewName">消息</span>
    </header>
    <div class="team-body" id="viewRoot"></div>
    <nav class="team-tabbar" role="tablist" aria-label="主导航">
      <button class="team-tab" type="button" role="tab" data-view="list" aria-selected="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20.5 14.5a2.5 2.5 0 0 1-2.5 2.5H9l-4.5 3v-3.2A2.5 2.5 0 0 1 3.5 14.5v-7A2.5 2.5 0 0 1 6 5h12a2.5 2.5 0 0 1 2.5 2.5z"></path>
          <path d="M7.5 9h9M7.5 12.5h6"></path>
        </svg>
        <span class="team-tab-label">消息</span>
      </button>
      <button class="team-tab" type="button" role="tab" data-view="contacts" aria-selected="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="9.5" cy="8.5" r="3.2"></circle>
          <path d="M3.8 19.5a5.7 5.7 0 0 1 11.4 0"></path>
          <circle cx="17.2" cy="9.5" r="2.3"></circle>
          <path d="M15.4 19.5a4.4 4.4 0 0 1 5.4-4"></path>
        </svg>
        <span class="team-tab-label">通讯录</span>
      </button>
      <button class="team-tab" type="button" role="tab" data-view="profile" aria-selected="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="8" r="3.6"></circle>
          <path d="M5.2 20a6.8 6.8 0 0 1 13.6 0"></path>
        </svg>
        <span class="team-tab-label">我</span>
      </button>
    </nav>
  </main>

  <noscript><p class="noscript">本预览需要启用 JavaScript 才能看到界面。</p></noscript>

  <!-- 数据层：接口实现只有一份（lib/client-parts 里的 api.js）。本页直接连真实后端，不再有 mock 传输 -->
  <script src="../lib/client-parts/foundation/loader.js"></script>
  <script src="../lib/client-parts/foundation/constants.js"></script>
  <script src="../lib/client-parts/foundation/utils.js"></script>
  <script src="../lib/client-parts/foundation/session.js"></script>
  <script src="../lib/client-parts/foundation/api.js"></script>
  <script src="../lib/client-parts/foundation/z-layers.js"></script>
  <script src="../lib/client-parts/foundation/styles.js"></script>
  <!-- 界面层：顺序与 build.cjs 的 UI_PARTS 完全一致（脚本不是模块，顺序即依赖；check-layout 会校验两者相同） -->
  <script src="js/view/messages.js"></script>
  <script src="js/float/target-source.js"></script>
  <script src="js/format/ui-format.js"></script>
  <script src="js/format/list-rules.js"></script>
  <script src="js/format/driver-view.js"></script>
  <script src="js/format/avatar-chain.js"></script>
  <script src="js/store/state.js"></script>
  <script src="js/store/persist.js"></script>
  <script src="js/store/events.js"></script>
  <script src="js/store/forms.js"></script>
  <script src="js/store/groups.js"></script>
  <script src="js/store/chat.js"></script>
  <script src="js/store/stats.js"></script>
  <script src="js/store/session.js"></script>
  <script src="js/store/dispatch.js"></script>
  <script src="js/store/index.js"></script>
  <script src="js/view/model-catalog.js"></script>
  <script src="js/interaction/model-selection-source.js"></script>
  <script src="js/interaction/session-bridge.js"></script>
  <script src="js/float/dock-state.js"></script>
  <script src="js/float/geometry.js"></script>
  <script src="js/float/panel-fields.js"></script>
  <script src="js/view/reverse-account.js"></script>
  <script src="js/view/render.js"></script>
  <script src="js/friend-group/form.js"></script>
  <script src="js/friend-group/view.js"></script>
  <script src="js/friend-group/modal.js"></script>
  <script src="js/interaction/chat.js"></script>
  <script src="js/view/admin.js"></script>
  <script src="js/interaction/reverse-login.js"></script>
  <script src="js/float/float.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
